name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore or verify prebuilt APK (immune to UTF-8 binary corruption)
        id: prepare_apk
        run: |
          set -euo pipefail
          APK_PATH="apk-distribution/app-debug.apk"
          B64_PATH="apk-distribution/app-debug.apk.base64"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          # 1. If ASCII Base64 representation exists, always decode it first to guarantee
          # bit-for-bit immunity against UTF-8 text conversion during web GitHub pushes.
          if [ -f "$B64_PATH" ] && [ -s "$B64_PATH" ]; then
            echo "Restoring binary APK from ASCII Base64 ($B64_PATH)..."
            tr -d '\r\n ' < "$B64_PATH" | base64 -d > "${APK_PATH}.decoded"
            mv "${APK_PATH}.decoded" "$APK_PATH"
          fi

          # 2. Verify checksum and ZIP structure
          NEED_BUILD=0
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            NEED_BUILD=1
          elif [ -f "$SHA_PATH" ] && [ -s "$SHA_PATH" ]; then
            if ! (cd apk-distribution && sha256sum -c app-debug.apk.sha256); then
              echo "Checksum mismatch detected on $APK_PATH; will rebuild clean APK."
              NEED_BUILD=1
            fi
          fi

          if [ "$NEED_BUILD" -eq 0 ]; then
            if ! unzip -tq "$APK_PATH"; then
              echo "ZIP integrity check failed on $APK_PATH; will rebuild clean APK."
              NEED_BUILD=1
            fi
          fi

          echo "need_build=${NEED_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 (fallback build if needed)
        if: steps.prepare_apk.outputs.need_build == '1'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle (fallback build if needed)
        if: steps.prepare_apk.outputs.need_build == '1'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild and sign clean APK if binary was missing or modified
        if: steps.prepare_apk.outputs.need_build == '1'
        run: |
          set -euo pipefail
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          gradle assembleDebug
          mkdir -p apk-distribution
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 app/build/outputs/apk/debug/app-debug.apk apk-distribution/app-debug.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --min-sdk-version 21 \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            apk-distribution/app-debug.apk
          (cd apk-distribution && sha256sum app-debug.apk > app-debug.apk.sha256)

      - name: Validate final APK integrity and signatures
        id: validate
        run: |
          set -euo pipefail
          APK_PATH="apk-distribution/app-debug.apk"
          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)
          unzip -tq "$APK_PATH"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
          fi

          APK_BYTES=$(stat -c '%s' "$APK_PATH")
          APK_HUMAN=$(ls -lh "$APK_PATH" | awk '{print $5}')
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "apk_bytes=${APK_BYTES}"
            echo "apk_human=${APK_HUMAN}"
            echo "apk_sha256=${APK_SHA256}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
          APK_SHA256: ${{ steps.validate.outputs.apk_sha256 }}
          APK_BYTES: ${{ steps.validate.outputs.apk_bytes }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "apk-distribution/app-debug.apk#app-debug.apk" \
            "apk-distribution/app-debug.apk.sha256#app-debug.apk.sha256" \
            --latest \
            --title "Mero Mayalu v5.6 Debug APK (${RELEASE_TAG})" \
            --notes "Verified & signed (v1+v2+v3) Android debug APK. SHA-256: \`${APK_SHA256}\` (${APK_BYTES} bytes)."

      - name: Write release summary
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.release_tag }}
          APK_BYTES: ${{ steps.validate.outputs.apk_bytes }}
          APK_HUMAN: ${{ steps.validate.outputs.apk_human }}
          APK_SHA256: ${{ steps.validate.outputs.apk_sha256 }}
        run: |
          {
            echo "### Debug APK Release Published"
            echo ""
            echo "- **Release Tag:** \`${RELEASE_TAG}\`"
            echo "- **APK Size:** ${APK_HUMAN} (${APK_BYTES} bytes)"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo "- **GitHub Release Page:** https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "- **Direct Latest Download URL:** https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          } >> "$GITHUB_STEP_SUMMARY"
